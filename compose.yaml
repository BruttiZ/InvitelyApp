name: invitely

x-app-build: &app-build
  context: .
  dockerfile: Docker/Dockerfile
  target: app

x-app-volumes: &app-volumes
  - ./:/var/www/html
  - vendor-data:/var/www/html/vendor
  - build-data:/var/www/html/public/build

x-laravel-environment: &laravel-environment
  APP_NAME: "${APP_NAME:-Invitely}"
  APP_ENV: local
  APP_DEBUG: "true"
  APP_URL: "${APP_URL:-http://localhost:8082}"
  FRONTEND_URL: "${FRONTEND_URL:-http://localhost:8082}"
  DB_CONNECTION: pgsql
  DB_HOST: "${DB_HOST:-postgres}"
  DB_PORT: "${DB_PORT:-5432}"
  DB_DATABASE: "${DB_DATABASE:-invitely}"
  DB_USERNAME: "${DB_USERNAME:-invitely}"
  DB_PASSWORD: "${DB_PASSWORD:-invitely}"
  REDIS_HOST: redis
  CACHE_STORE: redis
  QUEUE_CONNECTION: redis
  SESSION_DRIVER: redis
  MAIL_MAILER: smtp
  MAIL_HOST: mailpit
  MAIL_PORT: "1025"
  MAIL_FROM_ADDRESS: "${MAIL_FROM_ADDRESS:-no-reply@invitely.local}"
  MAIL_FROM_NAME: "${APP_NAME:-Invitely}"
  AWS_ACCESS_KEY_ID: invitely
  AWS_SECRET_ACCESS_KEY: invitely-secret
  AWS_DEFAULT_REGION: us-east-1
  AWS_BUCKET: invitely
  AWS_ENDPOINT: http://minio:9000
  AWS_USE_PATH_STYLE_ENDPOINT: "true"
  INVITELY_API_BASE_URL: "${INVITELY_API_BASE_URL:-}"
  INVITELY_API_KEY: "${INVITELY_API_KEY:-}"
  INVITELY_API_TIMEOUT: "${INVITELY_API_TIMEOUT:-30}"
  GO_API_URL: "${GO_API_URL:-}"
  GO_API_INTERNAL_KEY: "${GO_API_INTERNAL_KEY:-}"
  GO_API_TIMEOUT: "${GO_API_TIMEOUT:-30}"
  RUN_MIGRATIONS: "${RUN_MIGRATIONS:-true}"
  RUN_SEEDERS: "${RUN_SEEDERS:-true}"

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: "${DB_DATABASE:-invitely}"
      POSTGRES_USER: "${DB_USERNAME:-invitely}"
      POSTGRES_PASSWORD: "${DB_PASSWORD:-invitely}"
    ports:
      - "${DB_FORWARD_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-invitely} -d ${DB_DATABASE:-invitely}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - invitely

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${APP_PORT:-8082}:80"
    volumes:
      - ./:/var/www/html
      - build-data:/var/www/html/public/build:ro
      - ./Docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_healthy
      node:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/up >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - invitely

  app:
    build: *app-build
    environment: *laravel-environment
    volumes: *app-volumes
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "php artisan about --only=environment >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - invitely

  queue:
    build: *app-build
    command: php artisan queue:work --tries=3 --backoff=5
    environment:
      <<: *laravel-environment
      RUN_MIGRATIONS: "false"
      RUN_SEEDERS: "false"
    volumes: *app-volumes
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      app:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - invitely

  node:
    image: node:22-alpine
    working_dir: /var/www/html
    command: sh -lc "npm install && npm run build && rm -f public/hot && tail -f /dev/null"
    volumes:
      - ./:/var/www/html
      - node-modules:/var/www/html/node_modules
      - build-data:/var/www/html/public/build
    healthcheck:
      test: ["CMD-SHELL", "test -f public/build/manifest.json || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
    networks:
      - invitely

  redis:
    image: redis:7.4-alpine
    command: redis-server --appendonly yes
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - invitely

  mailpit:
    image: axllent/mailpit:v1.21
    ports:
      - "${MAILPIT_PORT:-8025}:8025"
    networks:
      - invitely

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: invitely
      MINIO_ROOT_PASSWORD: invitely-secret
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - invitely

networks:
  invitely:
    driver: bridge

volumes:
  build-data:
  minio-data:
  node-modules:
  postgres-data:
  redis-data:
  vendor-data:
